name: clips-studio — daily Shorts

on:
  schedule:
    # Once a day. Videos are uploaded as "scheduled" with publishAt
    # (12:30 / 15:30 / 18:30 / 20:30 / 22:30 IST), so GitHub's cron delay
    # (hours, measured in you-shorts) does not change when they go live.
    # 00:47 UTC = 06:17 IST nominal.
    - cron: '47 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (make clips, do not upload)"
        type: boolean
        default: true
      count:
        description: "How many clips (empty = automatic warm-up schedule)"
        default: ""
      only:
        description: "Only these streamers (comma separated, optional)"
        default: ""

concurrency:
  group: clips-studio
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # yt-dlp needs a JavaScript runtime for YouTube
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg + fonts
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-core && break
            echo "apt attempt $i failed — retrying in 20s"; sleep 20
          done
          ffmpeg -version | head -1

      - name: Install Python packages
        # -U keeps yt-dlp current: sites change and old versions break
        run: pip install -U -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Face detection model
        run: |
          mkdir -p models
          [ -f models/face_detection_yunet_2023mar.onnx ] || curl -fsSL -o models/face_detection_yunet_2023mar.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx || true

      - name: Write YouTube token (if connected)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json
            echo "YouTube connected — uploads ON"
          else
            echo "YouTube not connected yet — PREVIEW mode (clips saved as artifacts)"
          fi

      - name: Make clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || '' }}
          PYTHONIOENCODING: utf-8
          COUNT: ${{ inputs.count }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          args=()
          [ -n "$COUNT" ] && args+=(--count "$COUNT")
          IFS=',' read -ra ONLY <<< "$ONLY_INPUT"
          for s in "${ONLY[@]}"; do s="$(echo "$s" | xargs)"; [ -n "$s" ] && args+=(--only "$s"); done
          python -m clips_studio.run "${args[@]}"

      - name: Save clips for preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      # Easy viewing on a phone: the latest clips also go to the "previews"
      # branch (replaced every run, so the repo doesn't grow).
      - name: Publish clips to the "previews" branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          ls out/*.mp4 >/dev/null 2>&1 || { echo "no clips to publish"; exit 0; }
          tmp=$(mktemp -d)
          cp out/*.mp4 out/*.json "$tmp"/
          cp out/SUMMARY.md "$tmp"/README.md 2>/dev/null || true
          cd "$tmp"
          git init -q -b previews
          git add -A
          git -c user.name="clips-studio bot" -c user.email="clips-studio-bot@users.noreply.github.com" \
            commit -q -m "Preview clips from run $RUN"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" previews
          echo "Clips: https://github.com/${REPO}/tree/previews"

      - name: Save state
        if: always()
        run: |
          git config user.name "clips-studio bot"
          git config user.email "clips-studio-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --staged --quiet && { echo "No state changes."; exit 0; }
          git commit -m "auto: update state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && { echo "state saved"; exit 0; }
            sleep 5
          done
          echo "::error::could not save state — clips may repeat"; exit 1
